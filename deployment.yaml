apiVersion: apps/v1
kind: Deployment
metadata:
  name: age-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: age-calculator
  template:
    metadata:
      labels:
        app: age-calculator
    spec:
      containers:
      - name: age-calculator
        image: age_calculator:latest
        imagePullPolicy: Never
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 5800

---

apiVersion: v1
kind: Service
metadata:
  name: age-calculator-service
spec:
  type: NodePort
  selector:
    app: age-calculator
  ports:
  - port: 5800
    targetPort: 5800f
    nodePort: 30800